[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terraval"
version = "0.1.0"
description = "Agente CLI especialista em avaliações de imóveis rurais — NBR 14653, Atlas INCRA 2025, BACEN 4.676/2018"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Leandro Pitol", email = "leandro.resinasjardim@gmail.com" }]
keywords = ["avaliacao", "rural", "NBR14653", "laudo", "imovel", "terraval"]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-docx>=1.1.0",
    "fpdf2>=2.7.9",
    "markdown>=3.6",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
terraval = "terraval.cli:app"

[project.urls]
Homepage = "https://github.com/leandropitol/terraval"
Repository = "https://github.com/leandropitol/terraval"

[tool.setuptools.packages.find]
where = ["."]
include = ["terraval*"]

[tool.setuptools.package-data]
terraval = ["data/SKILL.md", "data/references/*.md"]
